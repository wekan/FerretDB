name: Release All (FerretDB v1)

# Manually triggered. Builds FerretDB v1 (wekan/FerretDB, SQLite backend) for
# every platform (via build.sh) into ./dist/ as individual per-arch binaries
# (ferretdb-<arch>[.exe]) and publishes a GitHub Release with each binary attached
# separately — NO ferretdb.zip — at https://github.com/wekan/FerretDB/releases, so
# each consumer downloads only the one binary for the platform it targets. The
# release notes are:
#   1. a fixed header line,
#   2. "Platforms: ..." listing every arch built into ./dist/, and
#   3. the CHANGELOG.md section for that version.
#
# The multi-arch Docker image is built by a SEPARATE workflow, docker.yml, which
# repackages the prebuilt binaries from the newest release into images and pushes
# them to Docker Hub, Quay.io and GHCR (no recompilation). This workflow dispatches
# docker.yml automatically as its final step (docker.yml also listens for a published
# release, but a release created here with the default GITHUB_TOKEN does not emit that
# event, so it is dispatched explicitly — workflow_dispatch is allowed for GITHUB_TOKEN).
#
# Usage:
#   gh workflow run release-all.yml -f version=v1.25.0
#   # leave version empty to derive it from `git describe`
#
# The CHANGELOG.md section for the version must be headed like
#   ## [v1.25.0](...) (YYYY-MM-DD)
# (the leading "## [<version>]" is what is matched).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v1.25.0 (empty = git describe)'
        required: false
        type: string

permissions:
  contents: write
  actions: write   # dispatch docker.yml after the release is published

env:
  GO_VERSION: '1.25.11'

jobs:
  # Build the per-arch binaries (all platforms) and publish the GitHub Release.
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so build/version's `git describe` stamps a real
          # v1.x version into the binaries (they panic at startup otherwise).
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Resolve release version
        id: ver
        run: |
          V="${{ inputs.version }}"
          [ -n "$V" ] || V="$(git describe --tags --always)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

      - name: Build per-arch binaries for all platforms
        # build.sh cross-compiles every platform Go + modernc.org/sqlite support
        # into ./dist/ as individual ferretdb-<arch>[.exe] binaries (+ README).
        # Sequential to stay within the runner's memory (16 concurrent Go builds
        # would risk OOM). setup-go put `go` on PATH, so build.sh uses it.
        run: ./build.sh dist-seq

      - name: Compose release notes (header + platforms + CHANGELOG section)
        id: notes
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"

          # 1. Every arch built into ./dist/ (a "ferretdb-<arch>[.exe]" file),
          #    listed in build.sh's canonical order with any extras appended.
          present="$(ls dist | sed -n 's#^ferretdb-\(.*\)#\1#p' | sed 's#\.exe$##' | sort -u)"
          order="amd64 arm64 armhf armel i386 ppc64le s390x riscv64 loong64 win64 win-arm64 win32 mac-amd64 mac-arm64 freebsd-amd64 freebsd-arm64"
          plats=""
          for a in $order; do
            printf '%s\n' "$present" | grep -qx "$a" && plats="${plats:+$plats, }$a"
          done
          for a in $present; do
            printf ' %s ' "$order" | grep -q " $a " || plats="${plats:+$plats, }$a"
          done

          # 2. CHANGELOG section for this version: "## [<version>]" up to the next
          #    "## [" header, trimmed of leading/trailing blank lines.
          awk -v ver="$V" '
            $0 ~ ("^## \\[" ver "\\]") { inblock=1; next }
            inblock && /^## \[/ { exit }
            inblock { print }
          ' CHANGELOG.md > changelog-section.md
          sed -i -e '/./,$!d' changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "::warning::No CHANGELOG.md section found for $V."
          fi

          # 3. Assemble: header line, Platforms line, then the CHANGELOG section.
          {
            echo "FerretDB v1 (SQLite) multi-platform binaries — one ferretdb-<arch>[.exe] asset per platform (no ferretdb.zip). Built by release-all.yml from the wekan/FerretDB fork."
            echo ""
            echo "Platforms: $plats"
            echo ""
            cat changelog-section.md
          } > release-notes.md

          echo "----- release notes for $V -----"
          cat release-notes.md
          echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create/update GitHub Release with the per-arch binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          NOTES_FILE="${{ steps.notes.outputs.notes_file }}"
          # Attach every per-arch binary (and the README.md) from ./dist/ as an
          # individual release asset; --clobber replaces same-named assets on re-run.
          assets=(dist/ferretdb-* dist/README.md)
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" "${assets[@]}" --clobber
            gh release edit "$V" --title "$V" --notes-file "$NOTES_FILE"
          else
            gh release create "$V" "${assets[@]}" \
              --title "$V" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Trigger the Docker image build for this release
        # Build the multi-arch Docker image from the per-arch binaries just published.
        # docker.yml listens for a published release too, but a release created above
        # with the default GITHUB_TOKEN does NOT emit that event — so dispatch it here.
        # workflow_dispatch is one of the events GITHUB_TOKEN is allowed to trigger, so
        # docker.yml runs and repackages this release's binaries into images.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          echo "Dispatching docker.yml for release $V ..."
          gh workflow run docker.yml --ref "${{ github.ref_name }}" -f version="$V"

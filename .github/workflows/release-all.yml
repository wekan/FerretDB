name: Release All (FerretDB v1)

# Manually triggered. Does a full FerretDB v1 (wekan/FerretDB, SQLite backend)
# release:
#   1. Builds FerretDB for every platform into ferretdb.zip (via build.sh) and
#      publishes a GitHub Release with it at
#      https://github.com/wekan/FerretDB/releases
#   2. Builds and pushes a multi-arch FerretDB Docker image to Docker Hub,
#      Quay.io and GHCR.
#
# Registry credentials use the SAME secrets as the wekan/wekan repo — each is
# base64("username:token"):
#   DOCKERHUB_AUTH   Docker Hub
#   QUAY_AUTH        Quay.io
#   GHCR_AUTH        ghcr.io
# (Add these secrets to this repo too; see releases/create-github-secrets.sh in
#  wekan/wekan.)
#
# Usage:
#   gh workflow run release-all.yml -f version=v1.24.2-wekan1
#   # leave version empty to derive it from `git describe`

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v1.24.2-wekan1 (empty = git describe)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.25.0'

jobs:
  # ─── 1. Build ferretdb.zip (all platforms) and publish the GitHub Release ────
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so build/version's `git describe` stamps a real
          # v1.x version into the binaries (they panic at startup otherwise).
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Resolve release version
        id: ver
        run: |
          V="${{ inputs.version }}"
          [ -n "$V" ] || V="$(git describe --tags --always)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

      - name: Build ferretdb.zip for all platforms
        # build.sh cross-compiles every platform Go + modernc.org/sqlite support
        # into ferretdb.zip (ferretdb/<arch>/ferretdb-<arch>[.exe] + README).
        # Sequential to stay within the runner's memory (16 concurrent Go builds
        # would risk OOM). setup-go put `go` on PATH, so build.sh uses it.
        run: ./build.sh zip-seq

      - name: Create/update GitHub Release with ferretdb.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" ferretdb.zip --clobber
          else
            gh release create "$V" ferretdb.zip \
              --title "$V" \
              --notes "FerretDB v1 (SQLite) multi-platform binaries — ferretdb.zip. Built by release-all.yml from the wekan/FerretDB fork."
          fi

  # ─── 2. Build and push the multi-arch FerretDB image to all registries ───────
  docker:
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub, Quay.io and GHCR
        env:
          DOCKERHUB_AUTH: ${{ secrets.DOCKERHUB_AUTH }}
          QUAY_AUTH: ${{ secrets.QUAY_AUTH }}
          GHCR_AUTH: ${{ secrets.GHCR_AUTH }}
        run: |
          login() {
            # $1 = registry host, $2 = base64("user:token")
            local host="$1" creds user token
            creds="$(printf '%s' "$2" | base64 -d)"
            user="${creds%%:*}"
            token="${creds#*:}"
            printf '%s' "$token" | docker login "$host" -u "$user" --password-stdin
          }
          login docker.io "$DOCKERHUB_AUTH"
          login quay.io   "$QUAY_AUTH"
          login ghcr.io   "$GHCR_AUTH"

      - name: Build and push multi-arch FerretDB image
        # The Dockerfile builds FerretDB from source with CGO disabled, so buildx
        # cross-compiles for each platform. Pushes the release version tag plus
        # latest to all three registries.
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/ppc64le,linux/s390x,linux/riscv64 \
            -t wekanteam/ferretdb:${VERSION} \
            -t wekanteam/ferretdb:latest \
            -t quay.io/wekan/ferretdb:${VERSION} \
            -t quay.io/wekan/ferretdb:latest \
            -t ghcr.io/wekan/ferretdb:${VERSION} \
            -t ghcr.io/wekan/ferretdb:latest \
            --push \
            .

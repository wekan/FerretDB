name: Release All (FerretDB v1)

# Manually triggered. Builds FerretDB v1 (wekan/FerretDB, SQLite backend) for
# every platform into ferretdb.zip (via build.sh) and publishes a GitHub Release
# with it at https://github.com/wekan/FerretDB/releases. The release notes are:
#   1. a fixed header line,
#   2. "Platforms: ..." listing every arch present in ferretdb.zip, and
#   3. the CHANGELOG.md section for that version.
#
# The multi-arch Docker image is built by a SEPARATE workflow, docker.yml, which
# repackages the prebuilt binaries from the newest release into images and pushes
# them to Docker Hub, Quay.io and GHCR (no recompilation).
#
# Usage:
#   gh workflow run release-all.yml -f version=v1.25.0
#   # leave version empty to derive it from `git describe`
#
# The CHANGELOG.md section for the version must be headed like
#   ## [v1.25.0](...) (YYYY-MM-DD)
# (the leading "## [<version>]" is what is matched).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v1.25.0 (empty = git describe)'
        required: false
        type: string

permissions:
  contents: write

env:
  GO_VERSION: '1.25.0'

jobs:
  # Build ferretdb.zip (all platforms) and publish the GitHub Release.
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so build/version's `git describe` stamps a real
          # v1.x version into the binaries (they panic at startup otherwise).
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Resolve release version
        id: ver
        run: |
          V="${{ inputs.version }}"
          [ -n "$V" ] || V="$(git describe --tags --always)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

      - name: Build ferretdb.zip for all platforms
        # build.sh cross-compiles every platform Go + modernc.org/sqlite support
        # into ferretdb.zip (ferretdb/<arch>/ferretdb-<arch>[.exe] + README).
        # Sequential to stay within the runner's memory (16 concurrent Go builds
        # would risk OOM). setup-go put `go` on PATH, so build.sh uses it.
        run: ./build.sh zip-seq

      - name: Compose release notes (header + platforms + CHANGELOG section)
        id: notes
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          command -v unzip >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq unzip; }

          # 1. Every arch present in ferretdb.zip (a "ferretdb/<arch>/..." entry),
          #    listed in build.sh's canonical order with any extras appended.
          present="$(unzip -Z1 ferretdb.zip | sed -n 's#^ferretdb/\([^/]*\)/.*#\1#p' | sort -u)"
          order="amd64 arm64 armhf armel i386 ppc64le s390x riscv64 loong64 win64 win-arm64 win32 mac-amd64 mac-arm64 freebsd-amd64 freebsd-arm64"
          plats=""
          for a in $order; do
            printf '%s\n' "$present" | grep -qx "$a" && plats="${plats:+$plats, }$a"
          done
          for a in $present; do
            printf ' %s ' "$order" | grep -q " $a " || plats="${plats:+$plats, }$a"
          done

          # 2. CHANGELOG section for this version: "## [<version>]" up to the next
          #    "## [" header, trimmed of leading/trailing blank lines.
          awk -v ver="$V" '
            $0 ~ ("^## \\[" ver "\\]") { inblock=1; next }
            inblock && /^## \[/ { exit }
            inblock { print }
          ' CHANGELOG.md > changelog-section.md
          sed -i -e '/./,$!d' changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "::warning::No CHANGELOG.md section found for $V."
          fi

          # 3. Assemble: header line, Platforms line, then the CHANGELOG section.
          {
            echo "FerretDB v1 (SQLite) multi-platform binaries — ferretdb.zip. Built by release-all.yml from the wekan/FerretDB fork."
            echo ""
            echo "Platforms: $plats"
            echo ""
            cat changelog-section.md
          } > release-notes.md

          echo "----- release notes for $V -----"
          cat release-notes.md
          echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create/update GitHub Release with ferretdb.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          NOTES_FILE="${{ steps.notes.outputs.notes_file }}"
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" ferretdb.zip --clobber
            gh release edit "$V" --title "$V" --notes-file "$NOTES_FILE"
          else
            gh release create "$V" ferretdb.zip \
              --title "$V" \
              --notes-file "$NOTES_FILE"
          fi

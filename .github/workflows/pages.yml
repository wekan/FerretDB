# Publish the documentation site to GitHub Pages.
#
# The docs are plain Markdown in docs/; no rendered HTML is committed. This workflow
# renders the Markdown to a static site with docs/build.py (into docs/_site, which is
# gitignored) and deploys that on every push to main-v1 — so the generated HTML only
# ever exists in the deployed artifact, never in the repository.
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". (No manual folder selection is needed with this source.)

name: Pages

on:
  push:
    branches: [main-v1]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render static site from Markdown (into docs/_site, not committed)
        run: python3 docs/build.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the rendered site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

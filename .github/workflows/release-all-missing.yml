name: Release All Missing (FerretDB v1)

# Build only the FerretDB binaries a release does not already carry.
#
# WHY: release-all.yml cross-compiles all platforms sequentially - they are
# built one at a time on purpose, because concurrent Go builds risk
# running the runner out of memory - attaching each one as soon as it is built.
# When a single platform is missing, or an upload failed, or a run was
# cancelled, that whole sequence had to run again to produce the one binary that
# was absent, replacing fifteen others' bytes with identical bytes on the way.
#
# HOW: ask the release what it already has, and hand that list to the SAME
# build.sh release-all.yml runs, as FERRETDB_DIST_SKIP_LIST. build.sh skips
# those targets and reports them as "have". There is no second copy of the
# target list here - it stays in build.sh's FERRETDB_DIST_TARGETS, where the
# ordinary release build reads it too.
#
# Each rebuilt binary is attached as soon as it is built, the same way
# release-all.yml does it: build.sh runs FERRETDB_DIST_PUBLISH
# (build/ferretdb/publish-release-asset.sh) on every binary that compiled and
# passed its telemetry audit, which writes the .sha256sum and uploads both.
#
# A platform counts as present only when BOTH ferretdb-<arch>[.exe] and its
# .sha256sum are on the release. A binary whose checksum upload failed is the
# half-published state this is meant to repair, so calling it present would
# leave it that way.
#
# Not every platform compiles (an arch modernc.org/sqlite has no port for is
# skipped), so "missing" means "missing and buildable": a platform that is
# absent AND does not compile is reported and does not fail the run.
#
# Usage:
#   gh workflow run release-all-missing.yml
#   gh workflow run release-all-missing.yml -f version=v1.24.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to complete (empty = git describe)'
        required: false
        type: string

permissions:
  contents: write
  actions: write

env:
  GO_VERSION: '1.27.0'

concurrency:
  group: ferretdb-release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build-missing:
    name: build what the release is missing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, so `git describe` can resolve a version

      - name: Check dependency risk indicators before release work
        shell: bash
        run: python3 releases/remote-release.py --audit

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Resolve release version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.tools/tmp"
          export TMPDIR="$PWD/.tools/tmp"
          bash tests/release-version.sh
          V="$INPUT_VERSION"
          [ -n "$V" ] || V="$(git describe --tags --always)"
          bash build/ferretdb/validate-version.sh "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Completing release: $V"

      - name: What the release already has
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$V" >/dev/null 2>&1; then
            gh release view "$V" --json assets --jq '.assets[].name' | sort > existing.txt
          else
            echo "No release $V yet - every platform is missing."
            : > existing.txt
          fi
          n="$(wc -l < existing.txt | tr -d ' ')"
          echo "$V already carries $n asset(s)."
          echo "### $V: $n asset(s) already published" >> "$GITHUB_STEP_SUMMARY"

      # Binaries are attached as each one is built (next step), so the release
      # has to exist first. Created only when there is none for this tag.
      - name: Create the GitHub Release if there is none
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$V" >/dev/null 2>&1; then
            gh release create "$V" --verify-tag --title "$V" \
              --notes "FerretDB v1 (SQLite) per-arch binaries. Created by release-all-missing.yml because no release existed for this tag."
          fi

      - name: Build only the missing platforms, attaching each as it is built
        id: build
        # The same ./build.sh dist-seq the full release runs; the skip list is
        # the only difference, and build.sh does the comparing.
        # FERRETDB_DIST_PUBLISH attaches each binary and its checksum to the
        # release right after that binary is built and audited.
        env:
          FERRETDB_DIST_SKIP_LIST: ${{ github.workspace }}/existing.txt
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FERRETDB_RELEASE_TAG: ${{ steps.ver.outputs.version }}
          FERRETDB_DIST_PUBLISH: ${{ github.workspace }}/build/ferretdb/publish-release-asset.sh
        run: |
          set -euo pipefail
          mkdir -p .tools/tmp
          export TMPDIR="$PWD/.tools/tmp" GOTELEMETRY=off
          python3 build/ferretdb/check-telemetry.py --source .
          python3 -B tests/release-telemetry.py
          python3 -B tests/telemetry-build.py
          python3 -B tests/release-upload.py
          python3 -B tests/integration-module-sync.py
          FERRETDB_RELEASE_VERSION="${{ steps.ver.outputs.version }}" ./build.sh dist-seq

      # Runs even when the run is cancelled or the build failed part-way: every
      # binary that FINISHED (build.sh's built.list) and is not on the release
      # yet is attached now. A cancel lands in the build step, so this cannot
      # wait for steps.build.outcome == 'success'.
      - name: Attach every finished binary, even when the run is cancelled
        if: ${{ always() && steps.create.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FERRETDB_RELEASE_TAG: ${{ steps.ver.outputs.version }}
        run: bash build/ferretdb/attach-finished.sh

      - name: Check the checksums of the binaries this run produced
        id: sums
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          n=0
          # publish-release-asset.sh wrote each checksum when it attached the
          # binary; check every binary has one and that it matches.
          for f in ferretdb-*; do
            case "$f" in *.sha256sum) continue ;; esac
            if [ ! -s "${f}.sha256sum" ]; then
              echo "::error::$f has no ${f}.sha256sum - it was not attached."
              exit 1
            fi
            sha256sum -c "${f}.sha256sum"
            n=$((n + 1))
          done
          echo "built=$n" >> "$GITHUB_OUTPUT"
          echo "Checked $n new binaries."
          # Zero is a legitimate outcome here, unlike in release-all.yml where it
          # means the build produced nothing: it means the release was already
          # complete. build.sh writes a README.md into dist/ either way, which is
          # why this counts ferretdb-* rather than everything in the directory.

      # The build step already attached every binary and checksum it made.
      # This checks they are on the release and says what was filled in.
      - name: Check what was filled in, and say so
        if: ${{ always() && steps.create.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Only the binaries and their checksums - NOT build.sh's README.md,
          # which the full release attaches and which is not missing. Taken
          # from build.sh's list of FINISHED binaries, not a dist/ glob, so a
          # compile a cancel interrupted is not counted as added.
          assets=()
          if [ -s tmp/ferretdb-dist/built.list ]; then
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              for f in "dist/ferretdb-$name" "dist/ferretdb-$name.exe"; do
                [ -f "$f" ] && assets+=( "$f" "$f.sha256sum" )
              done
            done < tmp/ferretdb-dist/built.list
          fi

          if [ "${#assets[@]}" -eq 0 ] && [ "$BUILD_OUTCOME" != success ]; then
            echo "::warning::The build did not finish ($BUILD_OUTCOME) and no binary was completed."
            exit 0
          fi
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::notice::$V is already complete - nothing to build."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing was missing. The release is complete." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Complete binary/checksum pairs were skipped above; an incomplete
          # pair was rebuilt and both halves re-attached together. Checked
          # against build.sh's list of FINISHED binaries, so on a cancelled run
          # a half-written file in dist/ is not reported as missing.
          FERRETDB_RELEASE_TAG="$V" bash build/ferretdb/attach-finished.sh --check

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Added ${#assets[@]} file(s):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${assets[@]#dist/}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Added ${#assets[@]} file(s) to $V."

      - name: Retry missing or failed Docker publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: python3 releases/retry-docker-release.py "$VERSION"

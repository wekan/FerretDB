name: Docker (from release binaries)
run-name: Docker ${{ inputs.version || github.event.release.tag_name }}

# Builds the FerretDB multi-arch Docker image from the PREBUILT per-arch binaries
# attached to a GitHub Release (no compilation) and pushes it to Docker Hub,
# Quay.io and GHCR — the same registries release-all.yml used to. Because the
# binaries are already built, buildx just repackages the right one per target
# into a runtime image. QEMU installs target runtime libraries and smoke-tests
# the packaged commands. Only platforms supported by the Debian runtime and
# having both FerretDB and mongosh assets are included (see release-platforms.sh).
#
# Registry credentials are the SAME base64("username:token") secrets as wekan/wekan:
#   DOCKERHUB_AUTH   Docker Hub
#   QUAY_AUTH        Quay.io
#   GHCR_AUTH        ghcr.io
#
# Usage:
#   gh workflow run docker.yml                     # newest release
#   gh workflow run docker.yml -f version=v1.25.0  # a specific release
# Also runs when a Release is published (note: a release created by the default
# GITHUB_TOKEN does not trigger this — dispatch it manually or use a PAT).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to use (empty = newest release)'
        required: false
        type: string
      mongosh_version:
        description: 'wekan/mongosh-patches release tag (empty = newest release)'
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test Docker release selection
        run: |
          mkdir -p .tools/tmp
          TMPDIR="$PWD/.tools/tmp" bash integration/docker_mongosh_test.sh
          TMPDIR="$PWD/.tools/tmp" bash tests/release-version.sh
          TMPDIR="$PWD/.tools/tmp" python3 -B tests/docker-publish.py

      - name: Set up target runtime emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm,arm64,ppc64le,s390x,riscv64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve release tag and download the Linux per-arch binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          [ -n "$TAG" ] || TAG="$INPUT_VERSION"
          if [ -z "$TAG" ]; then
            TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "::error::no release tag found"; exit 1; }
          bash build/ferretdb/validate-version.sh "$TAG"
          echo "Using release: $TAG"
          echo "VERSION=$TAG" >> "$GITHUB_ENV"
          # Download only the Linux ferretdb-<arch> assets (each pattern is an exact
          # name, so ferretdb-amd64 does not match ferretdb-mac-amd64). Missing
          # arches are tolerated: whatever is present defines the platform list.
          mkdir -p dist
          for a in amd64 arm64 armhf armv6 armel i386 ppc64le s390x riscv64 loong64; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              -p "ferretdb-$a" -D dist --clobber 2>/dev/null || true
          done
          echo "=== downloaded ==="; ls -la dist

      - name: Reject telemetry in downloaded FerretDB binaries
        run: |
          set -euo pipefail
          found=false
          for binary in dist/ferretdb-*; do
            [ -f "$binary" ] || continue
            python3 build/ferretdb/check-telemetry.py --kind ferretdb "$binary"
            found=true
          done
          "$found" || { echo '::error::No FerretDB binaries to audit'; exit 1; }

      - name: Download and verify mongosh packages for every Linux architecture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONGOSH_REPO: wekan/mongosh-patches
          REQUESTED_MONGOSH_VERSION: ${{ inputs.mongosh_version }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_MONGOSH_VERSION"
          if [ -z "$tag" ]; then
            tag="$(gh release list --repo "$MONGOSH_REPO" --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          [ -n "$tag" ] && [ "$tag" != null ] || { echo '::error::no mongosh release found'; exit 1; }
          echo "MONGOSH_VERSION=$tag" >> "$GITHUB_ENV"
          for binary in amd64 arm64 armhf i386 ppc64le s390x riscv64; do
            [ -f "dist/ferretdb-$binary" ] || continue
            arch="$binary"
            [ "$arch" != armhf ] || arch=armv7
            for suffix in tgz tgz.sha256sum; do
              gh release download "$tag" --repo "$MONGOSH_REPO" \
                --pattern "mongosh-$arch.$suffix" --dir dist --clobber
            done
            (cd dist && sha256sum -c "mongosh-$arch.tgz.sha256sum")
          done
          echo '=== verified mongosh packages ==='
          ls -la dist/mongosh-*

      - name: Prepare same-version official PowerPC Node runtime
        run: |
          set -euo pipefail
          mkdir -p "$PWD/.tools/tmp/ferretdb-node"
          export TMPDIR="$PWD/.tools/tmp/ferretdb-node"
          bash build/ferretdb/official-ppc64le-node.sh dist

      - name: Compute platform list from the downloaded binaries
        run: |
          set -euo pipefail
          plats="$(bash build/ferretdb/release-platforms.sh dist)"
          echo "Platforms: $plats"
          echo "PLATFORMS=$plats" >> "$GITHUB_ENV"

      - name: Authenticate and publish to each registry independently
        # Login failures must not skip publishing to the remaining registries.
        # The helper reports partial failures only after trying all three hosts.
        env:
          DOCKERHUB_AUTH: ${{ secrets.DOCKERHUB_AUTH }}
          QUAY_AUTH: ${{ secrets.QUAY_AUTH }}
          GHCR_AUTH: ${{ secrets.GHCR_AUTH }}
        run: bash build/ferretdb/publish-docker.sh

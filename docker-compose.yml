#-------------------------------------------------------------------------------------
# ==== WEKAN + FerretDB v1 (SQLite backend) ====
#
# Running from inside this FerretDB directory:
#     docker compose up --build
#
# This BUILDS FerretDB v1 from the source in this repository (see Dockerfile)
# and RUNS WeKan against it, mirroring how WeKan runs with MongoDB in the main
# WeKan docker-compose.yml at https://github.com/wekan/wekan
#
# FerretDB is a MongoDB-compatible database. Here it uses the embedded SQLite
# backend, so no separate PostgreSQL/MongoDB container is needed and all data is
# kept in a single named volume.
#
# Differences from running WeKan on real MongoDB:
#   - No MONGO_OPLOG_URL: FerretDB v1 has no replication oplog.
#   - METEOR_REACTIVITY_ORDER=polling: FerretDB v1 has no change streams,
#     so polling is the supported reactivity path.
#   - Attachments are stored on the filesystem (WRITABLE_PATH), not in GridFS.
#-------------------------------------------------------------------------------------

services:

  #-----------------------------------------------------------------------------------
  # ==== DATABASE: FerretDB v1 built from source, SQLite backend ====
  #-----------------------------------------------------------------------------------
  ferretdb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wekan-ferretdb
    restart: always
    networks:
      - wekan-tier
    expose:
      - 27017
    environment:
      - FERRETDB_HANDLER=sqlite
      - FERRETDB_SQLITE_URL=file:/state/
      - FERRETDB_LISTEN_ADDR=0.0.0.0:27017
      - FERRETDB_TELEMETRY=disable
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - wekan-ferretdb:/state

  #-----------------------------------------------------------------------------------
  # ==== WEKAN ====
  # Mirrors the wekan service from the main WeKan docker-compose.yml, but pointed
  # at FerretDB v1 with the additional options FerretDB requires.
  #-----------------------------------------------------------------------------------
  wekan:
    image: ghcr.io/wekan/wekan:latest
    container_name: wekan-app
    restart: always
    networks:
      - wekan-tier
    ports:
      # Docker outsideport:insideport.
      - 80:8080
    environment:
      #-------------------------------------------------------------------------
      # ==== REACTIVITY ====
      # FerretDB v1 has NO change streams and NO oplog, so use polling.
      - METEOR_REACTIVITY_ORDER=polling
      - DDP_TRANSPORT=uws
      #-------------------------------------------------------------------------
      # ==== WRITABLE PATH FOR FILE UPLOADS ====
      - WRITABLE_PATH=/data
      #-------------------------------------------------------------------------
      # ==== MONGO_URL — points to FerretDB (MongoDB-compatible) ====
      - MONGO_URL=mongodb://ferretdb:27017/wekan
      # No MONGO_OPLOG_URL: FerretDB v1 has no replication oplog.
      #-------------------------------------------------------------------------
      - ROOT_URL=http://localhost
      - PORT=8080
      #-------------------------------------------------------------------------
      # ==== WEKAN API AND EXPORT BOARD ====
      - WITH_API=true
      #-------------------------------------------------------------------------
      - BIGEVENTS_PATTERN=NONE
      - BROWSER_POLICY_ENABLED=true
      - RICHER_CARD_COMMENT_EDITOR=false
      - CARD_OPENED_WEBHOOK_ENABLED=false
      # Leave unset so it uses default and does not crash.
      # https://github.com/wekan/wekan/issues/2354#issuecomment-515305722
      - LDAP_BACKGROUND_SYNC_INTERVAL=''
    depends_on:
      - ferretdb
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - wekan-files:/data:rw

volumes:
  wekan-ferretdb:
    driver: local
  wekan-files:
    driver: local

networks:
  wekan-tier:
    driver: bridge
